services:
  - type: web
    name: committee-platform
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: AUTO_SEED
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      # 데이터 영구 보존용 Turso(클라우드 SQLite) 연결 정보.
      # 값은 코드/깃에 넣지 말고 Render 대시보드의 Environment 탭에서 직접 입력한다.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
